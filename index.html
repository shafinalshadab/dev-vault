<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevVault - Daily Code & Snippet Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">DevVault</h1>
            <p class="text-slate-400">Your Daily Code & Snippet Management Portfolio Project</p>
        </header>

        <!-- Form Section -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg mb-8 border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-cyan-300">Add New Code Snippet</h2>
            <form id="snippetForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 focus:outline-none focus:border-cyan-400">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Language</label>
                        <input type="text" id="language" placeholder="e.g., Python, JavaScript" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Tags (comma separated)</label>
                        <input type="text" id="tags" placeholder="e.g., algorithms, api" class="w-full bg-slate-900 border border-slate-700 rounded p-2 focus:outline-none focus:border-cyan-400">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Code Snippet</label>
                    <textarea id="code" rows="4" required class="w-full bg-slate-900 font-mono border border-slate-700 rounded p-2 focus:outline-none focus:border-cyan-400"></textarea>
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-2 px-4 rounded transition">Save Snippet</button>
            </form>
        </div>

        <!-- Snippets List Section -->
        <div>
            <h2 class="text-2xl font-semibold mb-4 text-cyan-300">Saved Snippets</h2>
            <div id="snippetsList" class="space-y-4">
                <!-- Dynamic Content Will Load Here -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function fetchSnippets() {
            try {
                const response = await fetch(`${API_URL}/snippets`);
                const snippets = await response.json();
                const listContainer = document.getElementById('snippetsList');
                listContainer.innerHTML = '';

                if (snippets.length === 0) {
                    listContainer.innerHTML = '<p class="text-slate-500">No snippets added yet. Start adding your daily code!</p>';
                    return;
                }

                snippets.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 p-5 rounded-xl border border-slate-700 shadow';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-lg font-bold text-cyan-400">${item.title}</h3>
                            <span class="text-xs bg-slate-700 text-cyan-300 px-2 py-1 rounded">${item.language}</span>
                        </div>
                        <pre class="bg-slate-950 p-3 rounded font-mono text-sm overflow-x-auto text-slate-300 mb-3"><code>${item.code}</code></pre>
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span>Tags: ${item.tags.join(', ')}</span>
                            <span>${item.created_at || ''}</span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching snippets:", error);
            }
        }

        document.getElementById('snippetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const language = document.getElementById('language').value;
            const tags = document.getElementById('tags').value.split(',').map(t => t.trim());
            const code = document.getElementById('code').value;

            try {
                const response = await fetch(`${API_URL}/snippets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, language, code, tags })
                });

                if (response.ok) {
                    document.getElementById('snippetForm').reset();
                    fetchSnippets();
                }
            } catch (error) {
                console.error("Error saving snippet:", error);
            }
        });

        fetchSnippets();
    </script>
</body>
</html>
